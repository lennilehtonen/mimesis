<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIMESIS</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Shell: top bar + tabs from Rerun viewer top bar (see LAHTEET.md), scaled for projector. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  #topbar{position:absolute;left:0;top:0;width:1920px;height:var(--topbar-h);display:flex;align-items:center;
    padding:0 28px;background:var(--bg);border-bottom:1px solid var(--line)}
  #wordmark{display:flex;align-items:center;gap:14px;font-weight:600;font-size:22px;letter-spacing:var(--tracking-wordmark)}
  #wordmark svg{width:19px;height:38px}
  #tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;height:44px}
  #tabs a{display:flex;align-items:center;gap:10px;padding:0 20px;border-radius:var(--r-md);color:var(--text-muted);
    text-decoration:none;font-size:var(--fs-md);font-weight:500;border:1px solid transparent;transition:background var(--t-fast),color var(--t-fast)}
  #tabs a .n{font-family:var(--font-mono);font-size:var(--fs-sm);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong)}
  #tabs a.on{color:var(--text);background:var(--surface-2);border-color:var(--line)}
  #tabs a.on .n{background:var(--text);color:var(--bg);border-color:var(--text)}
  #tabs a.done .n{border-color:var(--ok);color:var(--ok)}
  #tabs .sep{align-self:center;width:18px;height:1px;background:var(--line-strong)}
  #status{margin-left:auto;display:flex;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:var(--fs-sm);color:var(--text-muted)}
  .pill b{color:var(--text);font-weight:500}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--text-dim)}
  .pill.live .dot{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
  .pill.rec{border-color:var(--slip);color:var(--slip)} .pill.rec .dot{background:var(--slip);animation:pulse 1s infinite}
  .pill.off .dot{background:var(--text-dim)}
  @keyframes pulse{50%{opacity:.25}}

  main{position:absolute;left:0;top:var(--topbar-h);width:1920px;height:var(--main-h)}
  .screen{position:absolute;inset:0;display:none}
  .screen.on{display:block}

  #ticker{position:absolute;left:0;bottom:0;width:1920px;height:var(--ticker-h);display:flex;align-items:center;gap:36px;
    padding:0 28px;border-top:1px solid var(--line);background:var(--bg);font-size:var(--fs-sm);color:var(--text-muted)}
  #ticker b{font-family:var(--font-mono);font-weight:500;color:var(--text);margin-left:8px}
  #ticker .r b{color:var(--real)} #ticker .s b{color:var(--sim)}
  #ticker .right{margin-left:auto;color:var(--text-muted)}
</style>
<script>
/* ---------- M: tiny event bus. Screens subscribe; the data source emits. ----------
   Frontend dev: replace the DEMO block with the WebSocket / polling source, keep the event names.
   Events:
     'status'  {wrist:bool, hz:number, camera:bool, episodes:number}
     'imu'     {t:sec, ax,ay,az, gx,gy,gz, a:|a| m/s2, g:|gyro| rad/s, q:[w,x,y,z]}   (100 Hz)
     'contact' {t:sec, kind:'GRAB'|'TAP'|'SLIP'|'SET-DOWN'}
     'hand'    {joints:[[x,y],...21] normalized 0..1}
     'rec'     {on:bool, t0:sec}
*/
window.M = (() => {
  const h = {};
  return {
    on(e, f) { (h[e] = h[e] || []).push(f); },
    emit(e, d) { (h[e] || []).forEach(f => f(d)); },
    api: '' /* e.g. 'http://localhost:8000' */
  };
})();

</script>
</head>
<body>
<header id="topbar">
  <div id="wordmark">
    <!-- mark: amber ring (real) over cyan ring (sim), same as deck -->
    <svg viewBox="0 0 24 49" aria-hidden="true" fill="none" stroke-width="4"><circle cx="12" cy="12" r="9.5" stroke="#FFB547"/><circle cx="12" cy="37" r="9.5" stroke="#3EE6FF"/></svg>
    MIMESIS
  </div>
  <nav id="tabs">
    <a href="#record" data-s="record"><span class="n">1</span>Record</a><span class="sep"></span>
    <a href="#episode" data-s="episode"><span class="n">2</span>Episode</a><span class="sep"></span>
    <a href="#multiply" data-s="multiply"><span class="n">3</span>Multiply</a><span class="sep"></span>
    <a href="#ship" data-s="ship"><span class="n">4</span>Ship</a>
  </nav>
  <div id="status">
    <span class="pill off" id="st-wrist"><span class="dot"></span>Wrist <b class="mono" id="st-hz">— Hz</b></span>
    <span class="pill off" id="st-cam"><span class="dot"></span>Camera</span>
    <span class="pill"><span class="mono" id="st-eps">0</span>&nbsp;episodes</span>
  </div>
</header>

<main>
<!--SCREENS-->
</main>

<footer id="ticker">
  <span class="r">Real demos<b id="tk-real">12</b></span>
  <span class="s">Simulated episodes<b id="tk-sim">1,200</b></span>
  <span>Hours of data<b id="tk-hours">3.4</b></span>
  <span class="right">NullHacks Helsinki · 21.11.2026</span>
</footer>

<script>
/* tabs: hash routing + keys 1-4 for the pitch */
(() => {
  const ids = ['record', 'episode', 'multiply', 'ship'];
  function show() {
    const id = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'record';
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'scr-' + id));
    document.querySelectorAll('#tabs a').forEach(a => {
      const i = ids.indexOf(a.dataset.s);
      a.classList.toggle('on', a.dataset.s === id);
      a.classList.toggle('done', i < ids.indexOf(id));
    });
    M.emit('screen', id);
  }
  addEventListener('hashchange', show);
  addEventListener('keydown', e => { if (e.target.closest('input,select,textarea')) return; const i = '1234'.indexOf(e.key); if (i >= 0) location.hash = ids[i]; });
  addEventListener('DOMContentLoaded', show);
})();

/* status pills */
M.on('status', s => {
  const w = document.getElementById('st-wrist'), c = document.getElementById('st-cam');
  w.className = 'pill ' + (s.wrist ? 'live' : 'off'); c.className = 'pill ' + (s.camera ? 'live' : 'off');
  document.getElementById('st-hz').textContent = s.wrist ? Math.round(s.hz) + ' Hz' : '— Hz';
  document.getElementById('st-eps').textContent = s.episodes;
});

/* ---------- LIVE data source: WebSocket /ws, polling /latest + /status as fallback. ----------
   Served by receiver.py (http:) -> live. Opened as a file or with ?demo -> synthetic DEMO block below. */
window.MIMESIS_DEMO = location.protocol === 'file:' || /[?&]demo\b/.test(location.search);
M.camera = false;
if (!MIMESIS_DEMO) addEventListener('DOMContentLoaded', () => {
  let ws = null, polling = null, lastStatus = { wrist: false, hz: 0, episodes: 0 }, lastT = -1;
  const emitImu = s => {
    if (s.t <= lastT) return; lastT = s.t;
    M.emit('imu', { ...s, a: Math.hypot(s.ax, s.ay, s.az), g: Math.hypot(s.gx, s.gy, s.gz) });
  };
  const emitStatus = st => { lastStatus = { ...lastStatus, ...st }; M.emit('status', { ...lastStatus, camera: M.camera }); M.emit('jobs', st.jobs || {}); };
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { if (polling) { clearInterval(polling); polling = null; } };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      (m.imu || []).forEach(emitImu);
      (m.contacts || []).forEach(c => M.emit('contact', c));
      if (m.status) emitStatus(m.status);
    };
    ws.onclose = () => { startPolling(); setTimeout(connect, 2000); };
  }
  // fallback: GET /latest every 100 ms, GET /status every 1 s
  let t0ns = null;
  function startPolling() {
    if (polling) return; let k = 0;
    polling = setInterval(async () => {
      try {
        const r = await (await fetch('/latest?n=50')).json();
        r.samples.forEach(s => { t0ns = t0ns || s.time_ns; emitImu({ t: (s.time_ns - t0ns) / 1e9, ax: s.ax, ay: s.ay, az: s.az, gx: s.gx, gy: s.gy, gz: s.gz, q: [s.qw, s.qx, s.qy, s.qz] }); });
        if (k++ % 10 === 0) { const st = await (await fetch('/status')).json(); emitStatus({ wrist: st.hz > 1, hz: st.hz, episodes: st.episodes, recording: !!st.active_episode, jobs: st.jobs }); }
      } catch (e) { emitStatus({ wrist: false, hz: 0 }); }
    }, 100);
  }
  ['tk-real','tk-sim','tk-hours'].forEach(i => document.getElementById(i).textContent = '0');
  connect();
  setInterval(() => M.emit('status', { ...lastStatus, camera: M.camera }), 1000);
  // ticker: real numbers
  const tick = async () => { try {
    const s = await (await fetch('/files/dataset_stats.json', { cache: 'no-store' })).json();
    document.getElementById('tk-real').textContent = (s.episodes_real || 0).toLocaleString('en-US');
    document.getElementById('tk-sim').textContent = (s.episodes_sim || 0).toLocaleString('en-US');
    document.getElementById('tk-hours').textContent = (s.hours || 0).toFixed(2);
  } catch (e) {} };
  tick(); setInterval(tick, 5000);
});
if (MIMESIS_DEMO) addEventListener('DOMContentLoaded', () => {
  let t = 0, eps = 12;
  const kinds = ['GRAB', 'TAP', 'SLIP', 'SET-DOWN'];
  let nextEv = 1.2, evIdx = 0, spike = 0;
  setInterval(() => M.emit('status', { wrist: true, hz: 99 + Math.random() * 2, camera: true, episodes: eps }), 1000);
  setInterval(() => {
    for (let k = 0; k < 5; k++) {           // 5 samples / 50 ms = 100 Hz
      t += 0.01;
      if (t > nextEv) { M.emit('contact', { t, kind: kinds[evIdx % 4] }); spike = 1; evIdx++; nextEv = t + 1.1 + Math.random() * 1.4; }
      spike *= 0.9;
      const n = () => (Math.random() - .5) * .35;
      const ax = Math.sin(t * 1.3) * .8 + n() + spike * 9 * Math.sin(t * 90), ay = Math.cos(t * .9) * .6 + n(), az = 9.81 + Math.sin(t * 2.1) * .5 + n() + spike * 5;
      const gx = Math.sin(t * 1.7) * .9 + n(), gy = Math.cos(t * 1.1) * .7 + n(), gz = Math.sin(t * .6) * .5 + n() + spike * 3;
      M.emit('imu', { t, ax, ay, az, gx, gy, gz, a: Math.hypot(ax, ay, az), g: Math.hypot(gx, gy, gz),
        q: [Math.cos(t * .4), Math.sin(t * .4) * .3, Math.sin(t * .7) * .2, Math.sin(t * .3) * .2] });
    }
  }, 50);
  // fake 21-joint hand: wrist + 5 fingers x 4 joints, gently breathing
  setInterval(() => {
    const cx = .52 + Math.sin(t * .5) * .04, cy = .62 + Math.cos(t * .4) * .03, open = .75 + Math.sin(t * 1.2) * .25;
    const j = [[cx, cy]];
    [-.42, -.2, 0, .18, .34].forEach((a, f) => {
      for (let s = 1; s <= 4; s++) { const r = (.045 + s * .032 * (f ? 1 : .8)) * (f ? open : 1); j.push([cx + Math.sin(a * 1.6) * r * 1.1, cy - Math.cos(a * 1.6) * r * 1.6]); }
    });
    M.emit('hand', { joints: j });
  }, 33);
});
</script>
</body>
</html>
